<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;width:1500px;height:500px;overflow:hidden;background:#0b0c0d;
 font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#e8eaec}
.bg{position:absolute;inset:0;
 background:radial-gradient(600px 400px at 1150px 220px,rgba(94,242,192,.16),transparent 70%),
            radial-gradient(500px 360px at 380px 330px,rgba(167,139,250,.14),transparent 70%),#0b0c0d}
.grid{position:absolute;inset:0;opacity:.07;
 background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
 background-size:50px 50px}
/* leave room bottom-left for the X profile picture */
.copy{position:absolute;left:420px;top:92px}
.eyebrow{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;color:#8a9096;letter-spacing:.04em;margin-bottom:18px}
.eyebrow b{color:#5ef2c0;font-weight:600}
h1{margin:0;font-size:104px;line-height:.95;letter-spacing:-.045em;font-weight:800}
h1 span{color:#5ef2c0;text-shadow:0 0 50px rgba(94,242,192,.4)}
.sub{margin-top:22px;font-size:24px;color:#b9bfc5}
.book{position:absolute;right:70px;top:70px;width:400px;background:linear-gradient(180deg,#131517,#0f1113);
 border:1px solid #262a2e;border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.head{display:flex;justify-content:space-between;align-items:center;font-family:ui-monospace,Menlo,monospace;font-size:15px;color:#8a9096;margin-bottom:12px}
.head b{color:#a78bfa;font-family:ui-sans-serif,system-ui,sans-serif;font-size:20px}
.bar{height:6px;border-radius:9px;background:#1a1d20;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;width:62%;background:#a78bfa}
.row{display:grid;grid-template-columns:62px 1fr auto 22px;gap:10px;align-items:center;background:#1a1d20;border-radius:10px;
 padding:11px 12px;margin-bottom:7px;font-family:ui-monospace,Menlo,monospace;font-size:15px}
.tag{color:#a78bfa;background:rgba(167,139,250,.14);border-radius:6px;padding:3px 6px;font-weight:700;font-size:13px;text-align:center}
.red{color:#3a3f45;letter-spacing:-1px}
.foot{display:flex;justify-content:space-between;border-top:1px solid #262a2e;padding-top:12px;margin-top:6px;font-size:14px;color:#8a9096}
.foot b{font-family:ui-monospace,Menlo,monospace;color:#5ef2c0;font-weight:500}
.url{position:absolute;right:70px;bottom:34px;font-family:ui-monospace,Menlo,monospace;font-size:20px;color:#8a9096}
.url b{color:#e8eaec;font-weight:500}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="copy">
 <div class="eyebrow">● <b>DARK POOL</b> · ROBINHOOD CHAIN</div>
 <h1>Filled.<br><span>Not seen.</span></h1>
 <div class="sub">Sealed orders · one fair price · zero snipers fed</div>
</div>
<div class="book">
 <div class="head"><span>BATCH #1,204</span><b>Whisper</b><span style="color:#e8eaec">23s</span></div>
 <div class="bar"><i></i></div>
 <div class="row"><span class="tag">????</span><span class="red">████████</span><span class="red">█████</span><span>🔒</span></div>
 <div class="row"><span class="tag">????</span><span class="red">██████</span><span class="red">█████</span><span>🔒</span></div>
 <div class="row"><span class="tag">????</span><span class="red">█████████</span><span class="red">█████</span><span>🔒</span></div>
 <div class="row"><span class="tag">????</span><span class="red">███████</span><span class="red">█████</span><span>🔒</span></div>
 <div class="foot"><span>Bots can see:</span><b>nothing</b></div>
</div>
<div class="url"><b>silentfill.xyz</b></div>
</body></html>
