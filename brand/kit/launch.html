<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{width:1600px;height:900px;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;filter:blur(1.5px) saturate(1.2)}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 25%,rgba(0,0,0,.6) 100%),linear-gradient(180deg,rgba(5,5,5,.1) 0%,rgba(5,5,5,.55) 100%)}
.top{position:absolute;left:72px;right:72px;top:60px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:14px;font-size:34px}.brand svg{width:42px;height:42px}
.live{display:flex;align-items:center;gap:10px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);
 border:1px solid rgba(233,231,226,.22);border-radius:999px;padding:10px 18px;background:rgba(5,5,5,.35)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--jade);box-shadow:0 0 12px var(--jade)}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mk{width:150px;height:150px;margin-bottom:34px;filter:drop-shadow(0 0 30px rgba(143,211,182,.25))}
h1{margin:0;font-size:150px;line-height:.9;letter-spacing:-.02em}h1 em{color:var(--jade)}
.sub{margin-top:30px;font-size:26px;color:#c9c7c1;letter-spacing:.01em}
.sub b{color:var(--bone);font-weight:500}
.bottom{position:absolute;left:72px;right:72px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font-size:20px;color:#a9a7a1}
.ticker{font-family:"Instrument Serif";font-size:44px;color:var(--jade);letter-spacing:.01em}
</style></head><body>
<canvas id="w" width="800" height="450"></canvas><div class="shade"></div>
<div class="top"><div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><clipPath id="m"><circle cx="50" cy="50" r="34"/></clipPath></defs><circle cx="50" cy="50" r="40" fill="none" stroke="#e9e7e2" stroke-width="2.4"/><rect x="0" y="58" width="100" height="42" fill="#8fd3b6" clip-path="url(#m)"/><line x1="1" y1="58" x2="99" y2="58" stroke="#8fd3b6" stroke-width="1.5"/></svg><span class="serif">Silent Fill</span></div><div class="live mono"><i></i>Now live · Robinhood Chain</div></div>
<div class="c"><div class="mk"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><clipPath id="m"><circle cx="50" cy="50" r="34"/></clipPath></defs><circle cx="50" cy="50" r="40" fill="none" stroke="#e9e7e2" stroke-width="2.4"/><rect x="0" y="58" width="100" height="42" fill="#8fd3b6" clip-path="url(#m)"/><line x1="1" y1="58" x2="99" y2="58" stroke="#8fd3b6" stroke-width="1.5"/></svg></div><h1 class="serif">Filled. <em>Not seen.</em></h1>
<div class="sub">Sealed orders · <b>one fair price</b> · zero snipers fed</div></div>
<div class="bottom"><span class="ticker">$FILL</span><span class="mono">silentfill.xyz</span></div>
<script src="water.js"></script><script>water(document.getElementById("w"), 44.0)</script>
</body></html>
